---
name: Commit Check

"on":
    pull_request:
        branches: master
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

jobs:
    commit-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: commit-check/commit-check-action@v2
              with:
                  author-email: true
                  branch: false
                  job-summary: true
                  message: true
                  pr-comments: true
                  pr-title: false
