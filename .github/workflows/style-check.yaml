---
name: C/C++ format check (clang-format)
"on":
    pull_request:
        branches: master
    push:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    formatting-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Run clang-format style check for C programs.
              uses: jidicula/clang-format-action@v4.18.0
              with:
                  clang-format-version: "19"
